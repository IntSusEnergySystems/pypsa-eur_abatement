# Overnight MACC for planning year 2050.
# Demand and the sector pathway come from config/config.default.yaml.
# Technology costs are this planning year's costs. Weather stays 2013.
# BAU is solved first. Its emissions set the CO2 caps of MACC_1..MACC_6.
#   pixi run macc-year year=2050
foresight: overnight
planning_horizons:
- 2050
countries:
- AT
- BE
- BG
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GR
- HR
- HU
- IT
- LT
- LU
- LV
- NL
- PL
- PT
- RO
- SE
- SI
- SK
snapshots:
  start: "2013-01-01 00:00"
  end: "2013-12-31 23:00"
co2_budget:
  emissions_scope: CO2
  international_bunkers: false
  relative: false
  upper: null
  lower: null
costs:
  year: 2050
  emission_prices:
    enable: false
    co2: 0.0
sector:
  conventional_generation:
    OCGT: gas
    CCGT: gas
    coal: coal
    oil: oil
atlite:
  default_cutout: europe-2013-sarah3-era5
# One electricity node per country. Do not set n_clusters to "all":
# that skips administrative clustering.
clustering:
  mode: administrative
  administrative:
    level: 0
  temporal:
    averaging: 6h
    segmentation: false
    representative: false
solving:
  options:
    noisy_costs: false
    load_shedding:
      enable: true
    # LP files are large. /tmp is on the small root disk, so write them on /home.
    model_kwargs:
      solver_dir: resources/macc/solver-tmp
  solver_options:
    gurobi-default:
      threads: 8
macc:
  enable: true
  bau: false
data:
  costs:
    source: archive
    version: v0.16.0
run:
  prefix: macc
  name: all
  scenarios:
    enable: true
    file: macc/scenarios/2050.yaml
  shared_resources:
    policy: base
  default_target_rule: all
