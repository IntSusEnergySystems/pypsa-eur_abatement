# Overnight MACC for planning year 2040.
# Sector and industry pathways are taken from config/config.default.yaml.
# This file freezes costs, weather, spatial resolution and the 6h time step.
#
# Solve this year with pixi. The reference is solved first, its emissions
# set the CO2 caps, and each capped scenario is then solved on its own.
# PyPSA post-processing runs for every scenario. The MACC tables run after that.
#   pixi run macc-year year=2040
# All six years:
#   pixi run macc
foresight: overnight
planning_horizons:
- 2040
countries:
- AL
- AT
- BA
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- ME
- MK
- NL
- 'NO'
- PL
- PT
- RO
- RS
- SE
- SI
- SK
snapshots:
  start: "2013-01-01 00:00"
  end: "2013-12-31 23:00"
co2_budget:
  emissions_scope: CO2
  international_bunkers: false
  relative: false
  upper: null
  lower: null
costs:
  year: 2025
  emission_prices:
    enable: false
    co2: 0.0
atlite:
  default_cutout: europe-2013-sarah3-era5
# One electricity node per country. Do not set n_clusters to "all":
# that skips administrative clustering.
clustering:
  mode: administrative
  administrative:
    level: 0
  temporal:
    averaging: 6h
    segmentation: false
    representative: false
solving:
  options:
    noisy_costs: false
    # LP files are large. /tmp is on the small root disk, so write them on /home.
    model_kwargs:
      solver_dir: resources/macc/solver-tmp
  solver_options:
    gurobi-default:
      threads: 8
macc:
  enable: true
data:
  costs:
    source: archive
    version: v0.16.0
run:
  prefix: macc
  name: all
  scenarios:
    enable: true
    file: macc/scenarios/2040.yaml
  shared_resources:
    policy: base
  default_target_rule: all
